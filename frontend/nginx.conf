server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS. Resolve backend at request time so recreated containers with
    # new IPs do not leave nginx proxying to a stale upstream address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # Upload size limit. The 1m default rejects PDFs and audio with 413; long PDFs and
    # high-bitrate audio can reach hundreds of MB, so 500m leaves room.
    client_max_body_size 500m;

    # API reverse proxy
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pass request bodies straight through instead of spooling them to disk first,
        # so the backend can refuse an unauthenticated or oversized upload from its
        # headers before the body arrives (HTTP/1.1 lets chunked bodies stream too).
        proxy_request_buffering off;
        proxy_http_version 1.1;

        # Streaming (SSE) responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # Generous timeouts for large uploads and parsing
        client_body_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://$backend_upstream;
    }

    # ES modules (.mjs): nginx's default mime.types has no mapping, and browsers refuse to
    # run application/octet-stream scripts. pdfjs-dist's pdf.worker.min.mjs needs this.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }
}
