name: Release

# Pushing a tag such as v1.0.0 publishes a GitHub release with the notes from CHANGELOG.md
# and downloadable source archives (zip and tar.gz).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the version matches the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          grep -q "__version__ = \"$VERSION\"" backend/version.py \
            || { echo "backend/version.py does not say $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[0-9]/ { next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Source archives
        run: |
          NAME="local-notebook-$VERSION"
          git archive --format=zip --prefix="$NAME/" -o "$NAME.zip" "$GITHUB_REF_NAME"
          git archive --format=tar.gz --prefix="$NAME/" -o "$NAME.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "$NAME.zip" "$NAME.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Local Notebook $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "local-notebook-$VERSION.zip" "local-notebook-$VERSION.tar.gz" SHA256SUMS.txt
