services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Not published on the host: Redis has no password and the worker runs the jobs it
    # finds there, so only the containers of this stack may reach it. To use it from a
    # backend running outside Docker, publish it in a docker-compose.override.yml
    # ("127.0.0.1:6379:6379") on a single-user machine only.

  # ── Milvus standalone (official three-container setup) ──────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${LOCAL_NOTEBOOK_DATA_DIR:-./local-notebook-data}/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${LOCAL_NOTEBOOK_DATA_DIR:-./local-notebook-data}/minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.6
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${LOCAL_NOTEBOOK_DATA_DIR:-./local-notebook-data}/milvus:/var/lib/milvus
    # Not published on the host: Milvus has no authentication here and holds every user's
    # vectors. Publish "127.0.0.1:19530:19530" in a docker-compose.override.yml only on a
    # single-user machine that runs the backend outside Docker.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
  # ───────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      milvus:
        condition: service_healthy
    user: "${CURRENT_UID:-0}:${CURRENT_GID:-0}"
    environment:
      - REDIS_URL=redis://redis:6379
      # Empty → the backend generates a random key once and keeps it in the data folder.
      - SECRET_KEY=${SECRET_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/local_notebook.db
      - MILVUS_URI=http://milvus:19530
      - UPLOAD_DIR=/app/data/uploads
      # Requests reach the backend through the frontend's nginx, which replaces any
      # X-Forwarded-For with the real client address; trusting it gives the sign-in
      # limiter each user's own address.
      - FORWARDED_ALLOW_IPS=*
    volumes:
      - ${LOCAL_NOTEBOOK_DATA_DIR:-./local-notebook-data}:/app/data
    ports:
      # The interface reaches the API through nginx (port 8080); 8081 is for this machine only.
      - "127.0.0.1:8081:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"