# SearXNG metasearch engine used by Local Notebook for web search.
# Started automatically by ./start.sh when Docker is available
# (disable with LOCAL_NOTEBOOK_SEARXNG=0 in .env).
#
# Manual control:
#   docker compose -f services/searxng/docker-compose.yml up -d
#   docker compose -f services/searxng/docker-compose.yml down
name: local-notebook-searxng

services:
  searxng:
    container_name: local-notebook-searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      # Bound to localhost only; 8080 is taken by the Local Notebook frontend.
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:${SEARXNG_PORT:-8888}/
      # Overrides server.secret_key; generated by ./start.sh and kept in .env
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    volumes:
      - ./config/:/etc/searxng/
      - searxng-cache:/var/cache/searxng/
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  searxng-cache:
